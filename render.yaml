# Render Blueprint: one free web service serves the API and the built React app.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecuador-alerta
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy a new commit only after its GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1" # Render's proxy sits in front: needed for per-visitor rate limits
      - key: DATA_MODE
        value: live
      - key: CACHE_TTL_MINUTES
        value: "45"
      - key: FIRMS_SOURCES
        value: VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT
      - key: FIRMS_MAP_KEY
        sync: false # set it in the Render dashboard, never in git
      - key: LLM_PROVIDER
        value: none # change to anthropic or openai once you add a key
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false # e.g. https://api.groq.com/openai/v1 for Groq's free tier
      - key: LLM_MODEL
        sync: false
